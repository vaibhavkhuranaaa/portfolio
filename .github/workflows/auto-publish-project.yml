name: Automatically publish verified project

on:
  repository_dispatch:
    types: [project-release-ready]

permissions:
  contents: write

concurrency:
  group: portfolio-auto-publication
  cancel-in-progress: false

env:
  VERCEL_CLI_VERSION: 56.3.2

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Validate trusted release event
        env:
          PROJECT_REPOSITORY: ${{ github.event.client_payload.repository }}
          PROJECT_SOURCE_REF: ${{ github.event.client_payload.ref }}
          PROJECT_MANIFEST_PATH: ${{ github.event.client_payload.manifest_path }}
        run: |
          node -e 'if (!/^[\w.-]+\/[\w.-]+$/.test(process.env.PROJECT_REPOSITORY ?? "")) throw new Error("Invalid repository")'
          node -e 'if (!/^[0-9a-f]{40}$/.test(process.env.PROJECT_SOURCE_REF ?? "")) throw new Error("Release ref must be an exact SHA")'
          node -e 'const value=process.env.PROJECT_MANIFEST_PATH ?? ""; if (!/^portfolio\/[A-Za-z0-9_./-]+\.json$/.test(value) || value.includes("..")) throw new Error("Invalid manifest path")'
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - name: Admit only a verified live project
        env:
          PROJECT_MANIFEST_READ_TOKEN: ${{ secrets.PROJECT_MANIFEST_READ_TOKEN }}
        run: node scripts/auto-publish-project.mjs "${{ github.event.client_payload.repository }}" "${{ github.event.client_payload.ref }}" "${{ github.event.client_payload.manifest_path }}"
      - name: Commit the generated registry entry
        run: |
          git config user.name "${{ github.repository_owner }}"
          git config user.email "${{ github.repository_owner }}@users.noreply.github.com"
          git add scripts/project-registry.mjs
          git commit -m "chore: publish verified project" || exit 0
          git push
      - name: Configure Vercel production release
        run: npx --yes vercel@${VERCEL_CLI_VERSION} pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build the updated live registry
        env:
          PROJECT_MANIFEST_READ_TOKEN: ${{ secrets.PROJECT_MANIFEST_READ_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          RESUME_URL: ${{ vars.RESUME_URL }}
          SITE_OWNER: ${{ vars.SITE_OWNER }}
          SITE_SOCIAL_URL: ${{ vars.SITE_SOCIAL_URL }}
          REQUIRE_PUBLIC_SITE_CONFIG: true
        run: npx --yes vercel@${VERCEL_CLI_VERSION} build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy the updated portfolio
        run: npx --yes vercel@${VERCEL_CLI_VERSION} deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
