name: Validate portfolio

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - name: Build from committed exact-SHA manifest fixtures
        run: npm run build
        env:
          PROJECT_MANIFEST_SOURCE_DIR: tests/fixtures/manifests
          PROJECTION_GENERATED_AT: 2026-07-23T00:00:00.000Z
