name: Verify Git-connected portfolio release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: portfolio-production-release
  cancel-in-progress: false

env:
  LIVE_URL: https://portfolio-reeper1.vercel.app

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - name: Generate the exact verified catalog snapshot
        run: npm run sync-projects
      - name: Wait for Vercel Git deployment of this commit
        run: |
          for attempt in $(seq 1 40); do
            payload="$(curl --fail --silent --show-error "$LIVE_URL/api/release" || true)"
            if printf '%s' "$payload" | jq -e --arg sha "$GITHUB_SHA" '.status == "ok" and .source_sha == $sha' >/dev/null; then
              exit 0
            fi
            test "$attempt" -lt 40
            sleep 15
          done
      - name: Verify public portfolio
        env:
          RELEASE_NOTE: Automatic Git-connected release
          RELEASE_APPROVED_AT: ${{ github.event.head_commit.timestamp }}
          RELEASE_SOURCE_SHA: ${{ github.sha }}
          RELEASE_RECORD_PATH: artifacts/portfolio-release-record.json
        run: node scripts/verify-portfolio-release.mjs "$LIVE_URL"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-release-record-${{ github.sha }}
          path: artifacts/portfolio-release-record.json
          if-no-files-found: error
