name: Release approved portfolio

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Approved 40-character portfolio source revision
        required: true
        type: string
      approval_timestamp:
        description: Owner approval time in ISO-8601 UTC
        required: true
        type: string
      release_note:
        description: Brief note describing the approved portfolio update
        required: false
        default: Manual maintenance release
        type: string

permissions:
  contents: read

concurrency:
  group: portfolio-production-release
  cancel-in-progress: false

env:
  VERCEL_CLI_VERSION: 56.3.2

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - name: Verify approved main revision
        run: |
          test "$(git rev-parse HEAD)" = "${{ inputs.source_sha }}"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${{ inputs.source_sha }}"
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - name: Configure protected Vercel release
        run: npx --yes vercel@${VERCEL_CLI_VERSION} pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build approved catalog once
        env:
          PROJECT_MANIFEST_READ_TOKEN: ${{ secrets.PROJECT_MANIFEST_READ_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          RESUME_URL: ${{ vars.RESUME_URL }}
          SITE_OWNER: ${{ vars.SITE_OWNER }}
          SITE_SOCIAL_URL: ${{ vars.SITE_SOCIAL_URL }}
          REQUIRE_PUBLIC_SITE_CONFIG: true
        run: npx --yes vercel@${VERCEL_CLI_VERSION} build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy prebuilt artifact
        id: deploy
        run: |
          deployment_url="$(npx --yes vercel@${VERCEL_CLI_VERSION} deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})"
          echo "deployment_url=${deployment_url}" >> "$GITHUB_OUTPUT"
      - name: Verify deployed pages, sources, demos, metadata, disclosure, sitemap, and expiry
        env:
          RELEASE_NOTE: ${{ inputs.release_note }}
          RELEASE_APPROVED_AT: ${{ inputs.approval_timestamp }}
          RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_RECORD_PATH: artifacts/portfolio-release-record.json
        run: node scripts/verify-portfolio-release.mjs "${{ steps.deploy.outputs.deployment_url }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-release-record-${{ inputs.source_sha }}
          path: artifacts/portfolio-release-record.json
          if-no-files-found: error
